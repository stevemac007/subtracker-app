<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Clipboard body -->
  <rect x="180" y="60" width="240" height="300" rx="16" stroke="#f5a623" stroke-width="3" opacity=".6"/>
  <!-- Clipboard clip -->
  <rect x="240" y="44" width="120" height="32" rx="8" stroke="#f5a623" stroke-width="3" opacity=".6"/>
  <circle cx="300" cy="60" r="6" fill="#f5a623" opacity=".4"/>

  <!-- Jersey outline in center -->
  <path d="M265 140 L255 140 L240 160 L248 164 L255 152 L255 210 L345 210 L345 152 L352 164 L360 160 L345 140 L335 140 L320 150 L280 150 Z"
        stroke="#f5a623" stroke-width="2.5" stroke-linejoin="round" opacity=".5" fill="none"/>
  <!-- Jersey number placeholder -->
  <text x="300" y="192" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="28" fill="#f5a623" opacity=".3">?</text>

  <!-- Blank roster lines -->
  <g stroke="#7a6548" stroke-width="1.5" opacity=".3" stroke-dasharray="4 4">
    <line x1="210" y1="240" x2="390" y2="240"/>
    <line x1="210" y1="264" x2="390" y2="264"/>
    <line x1="210" y1="288" x2="390" y2="288"/>
    <line x1="210" y1="312" x2="390" y2="312"/>
    <line x1="210" y1="336" x2="390" y2="336"/>
  </g>

  <!-- Small number boxes on left of each line -->
  <g stroke="#7a6548" stroke-width="1" opacity=".25">
    <rect x="210" y="230" width="20" height="16" rx="2"/>
    <rect x="210" y="254" width="20" height="16" rx="2"/>
    <rect x="210" y="278" width="20" height="16" rx="2"/>
    <rect x="210" y="302" width="20" height="16" rx="2"/>
    <rect x="210" y="326" width="20" height="16" rx="2"/>
  </g>

  <!-- Plus icon -->
  <circle cx="300" cy="380" r="0" fill="none"/>
  <g opacity=".5">
    <circle cx="300" cy="130" r="0"/>
  </g>

  <!-- Decorative plus at bottom -->
  <g stroke="#f5a623" stroke-width="3" opacity=".4" stroke-linecap="round">
    <line x1="300" y1="365" x2="300" y2="385"/>
    <line x1="290" y1="375" x2="310" y2="375"/>
  </g>
</svg>
