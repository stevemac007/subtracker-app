<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900" fill="none">
  <!-- Full court layout, designed to sit behind the 520px app container -->
  
  <!-- Outer boundary -->
  <rect x="20" y="20" width="480" height="860" rx="0" stroke="#f5a623" stroke-width="1.5"/>
  
  <!-- Half court line -->
  <line x1="20" y1="450" x2="500" y2="450" stroke="#f5a623" stroke-width="1.5"/>
  
  <!-- Center circle -->
  <circle cx="260" cy="450" r="60" stroke="#f5a623" stroke-width="1.5"/>
  <circle cx="260" cy="450" r="6" fill="#f5a623" opacity=".3"/>
  
  <!-- Top key (paint area) -->
  <rect x="170" y="20" width="180" height="190" stroke="#f5a623" stroke-width="1"/>
  <!-- Top free throw circle -->
  <circle cx="260" cy="210" r="60" stroke="#f5a623" stroke-width="1"/>
  <!-- Top backboard + rim -->
  <line x1="230" y1="38" x2="290" y2="38" stroke="#f5a623" stroke-width="1.5"/>
  <circle cx="260" cy="50" r="10" stroke="#f5a623" stroke-width="1"/>
  <!-- Top three-point arc -->
  <path d="M80 20 L80 140 Q80 360 260 340 Q440 360 440 140 L440 20" stroke="#f5a623" stroke-width="1" fill="none"/>
  
  <!-- Bottom key (paint area) -->
  <rect x="170" y="690" width="180" height="190" stroke="#f5a623" stroke-width="1"/>
  <!-- Bottom free throw circle -->
  <circle cx="260" cy="690" r="60" stroke="#f5a623" stroke-width="1"/>
  <!-- Bottom backboard + rim -->
  <line x1="230" y1="862" x2="290" y2="862" stroke="#f5a623" stroke-width="1.5"/>
  <circle cx="260" cy="850" r="10" stroke="#f5a623" stroke-width="1"/>
  <!-- Bottom three-point arc -->
  <path d="M80 880 L80 760 Q80 540 260 560 Q440 540 440 760 L440 880" stroke="#f5a623" stroke-width="1" fill="none"/>
  
  <!-- Hash marks on keys -->
  <g stroke="#f5a623" stroke-width="1">
    <!-- Top key hash marks (left) -->
    <line x1="160" y1="80" x2="170" y2="80"/>
    <line x1="160" y1="120" x2="170" y2="120"/>
    <line x1="160" y1="160" x2="170" y2="160"/>
    <!-- Top key hash marks (right) -->
    <line x1="350" y1="80" x2="360" y2="80"/>
    <line x1="350" y1="120" x2="360" y2="120"/>
    <line x1="350" y1="160" x2="360" y2="160"/>
    <!-- Bottom key hash marks (left) -->
    <line x1="160" y1="740" x2="170" y2="740"/>
    <line x1="160" y1="780" x2="170" y2="780"/>
    <line x1="160" y1="820" x2="170" y2="820"/>
    <!-- Bottom key hash marks (right) -->
    <line x1="350" y1="740" x2="360" y2="740"/>
    <line x1="350" y1="780" x2="360" y2="780"/>
    <line x1="350" y1="820" x2="360" y2="820"/>
  </g>
</svg>
