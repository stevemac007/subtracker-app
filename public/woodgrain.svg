<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Dark hardwood floor tile pattern -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Wood grain lines - horizontal, slightly wavy, varying opacity -->
  <g stroke="#f5a623" fill="none" opacity=".15">
    <path d="M0 8 Q50 6 100 9 Q150 7 200 8" stroke-width="0.8"/>
    <path d="M0 18 Q40 20 100 17 Q160 19 200 18" stroke-width="0.5"/>
    <path d="M0 30 Q60 28 100 31 Q140 29 200 30" stroke-width="0.7"/>
    <path d="M0 42 Q50 44 100 41 Q150 43 200 42" stroke-width="0.4"/>
    <path d="M0 55 Q70 53 100 56 Q130 54 200 55" stroke-width="0.8"/>
    <path d="M0 65 Q40 67 100 64 Q160 66 200 65" stroke-width="0.5"/>
    <path d="M0 78 Q55 76 100 79 Q145 77 200 78" stroke-width="0.6"/>
    <path d="M0 90 Q60 92 100 89 Q140 91 200 90" stroke-width="0.8"/>
    <path d="M0 102 Q45 100 100 103 Q155 101 200 102" stroke-width="0.4"/>
    <path d="M0 115 Q65 113 100 116 Q135 114 200 115" stroke-width="0.7"/>
    <path d="M0 126 Q50 128 100 125 Q150 127 200 126" stroke-width="0.5"/>
    <path d="M0 138 Q55 136 100 139 Q145 137 200 138" stroke-width="0.8"/>
    <path d="M0 150 Q40 152 100 149 Q160 151 200 150" stroke-width="0.4"/>
    <path d="M0 162 Q70 160 100 163 Q130 161 200 162" stroke-width="0.6"/>
    <path d="M0 175 Q50 177 100 174 Q150 176 200 175" stroke-width="0.8"/>
    <path d="M0 188 Q60 186 100 189 Q140 187 200 188" stroke-width="0.5"/>
  </g>
  
  <!-- Plank seam lines (vertical) -->
  <g stroke="#000" opacity=".25">
    <line x1="66" y1="0" x2="66" y2="200" stroke-width="0.5"/>
    <line x1="134" y1="0" x2="134" y2="200" stroke-width="0.5"/>
  </g>
  
  <!-- Subtle knot -->
  <ellipse cx="100" cy="100" rx="6" ry="4" stroke="#f5a623" stroke-width="0.5" opacity=".1" fill="none"/>
</svg>
