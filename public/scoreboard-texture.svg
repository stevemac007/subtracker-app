<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- LED dot-matrix pattern tile -->
  <rect width="20" height="20" fill="transparent"/>
  <!-- Dot grid - simulates LED scoreboard pixels -->
  <circle cx="5" cy="5" r="1" fill="#f5a623" opacity=".25"/>
  <circle cx="15" cy="5" r="1" fill="#f5a623" opacity=".20"/>
  <circle cx="5" cy="15" r="1" fill="#f5a623" opacity=".20"/>
  <circle cx="15" cy="15" r="1" fill="#f5a623" opacity=".25"/>
  <circle cx="10" cy="10" r="0.8" fill="#f5a623" opacity=".14"/>
  <!-- Faint horizontal scan line -->
  <line x1="0" y1="10" x2="20" y2="10" stroke="#f5a623" stroke-width="0.3" opacity=".18"/>
</svg>
